<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Harmonika · B-griff</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1b1a18;
    --panel: #26241f;
    --panel-edge: #3a3730;
    --ink: #efe9dc;
    --ink-dim: #a39c8d;
    --white-key: #f3ecdc;
    --white-key-edge: #c9bea7;
    --white-key-ink: #3a3328;
    --black-key: #15130f;
    --black-key-edge: #4a443a;
    --black-key-ink: #d9d1c0;
    --pressed: #c98a2e;
    --brass: #b8893a;
    --brass-ink: #1b1a18;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { } }
  :root[data-theme="dark"] { }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column;
  }

  /* Register bar – looks like the brass switch row above the treble keyboard */
  #bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    padding-left: calc(10px + env(safe-area-inset-left, 0px));
    padding-right: calc(10px + env(safe-area-inset-right, 0px));
    background: var(--panel);
    border-bottom: 1px solid var(--panel-edge);
    overflow-x: auto; white-space: nowrap;
  }
  #bar::-webkit-scrollbar { display: none; }
  .reg {
    flex: 0 0 auto;
    border: 1px solid var(--brass);
    color: var(--brass);
    background: transparent;
    border-radius: 999px;
    padding: 5px 11px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .reg.on { background: var(--brass); color: var(--brass-ink); font-weight: 600; }
  .sep { flex: 0 0 1px; height: 22px; background: var(--panel-edge); margin: 0 4px; }
  .ctl {
    flex: 0 0 auto;
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    background: transparent;
    border-radius: 8px;
    padding: 5px 10px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .ctl.on { border-color: var(--ink-dim); background: var(--panel-edge); }
  .oct { color: var(--ink-dim); font-size: 13px; min-width: 2.2em; text-align: center; }
  input[type=range] { width: 90px; accent-color: var(--brass); }
  .spacer { flex: 1 1 auto; }

  /* Scroll strip – drag along it to move the whole keyboard */
  #strip {
    flex: 0 0 5mm; position: relative;
    background:
      repeating-linear-gradient(90deg, transparent 0 7px, rgba(255,255,255,.05) 7px 8px),
      var(--panel);
    border-bottom: 1px solid var(--panel-edge);
    touch-action: none; cursor: grab;
  }
  #strip.drag { cursor: grabbing; background-color: var(--panel-edge); }
  #thumb {
    position: absolute; top: 35%; height: 30%;
    border-radius: 999px; background: var(--brass); opacity: .75;
    pointer-events: none;
  }

  /* Keyboard */
  #board {
    flex: 1 1 auto; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 0%, #2c2a25 0%, var(--bg) 70%);
  }
  #keys { position: absolute; left: 0; top: 0; will-change: transform; }
  .key {
    position: absolute;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    pointer-events: none; /* hit-testing is done on the board */
    transition: transform 40ms, background-color 40ms;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 2px rgba(0,0,0,.45);
  }
  .key.w { background: radial-gradient(circle at 35% 30%, #fffaf0, var(--white-key) 55%, #ddd2bb); color: var(--white-key-ink); border: 1px solid var(--white-key-edge); }
  .key.b { background: radial-gradient(circle at 35% 30%, #3b3732, var(--black-key) 60%); color: var(--black-key-ink); border: 1px solid var(--black-key-edge); }
  /* C buttons carry a ridged marker so you can find them by eye, like on a real treble keyboard */
  .key.mark::before {
    content: ''; position: absolute; inset: 20%; border-radius: 50%;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.13) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.13) 0 1px, transparent 1px 6px);
  }
  .key.down { background: var(--pressed) !important; color: #1b1a18 !important; transform: scale(.93); box-shadow: inset 0 2px 3px rgba(0,0,0,.4); }
  .key .n { display: none; position: relative; }
  #board.names .key .n { display: block; }
  .key .n small { font-weight: 400; opacity: .6; font-size: .75em; }
</style>
</head>
<body>
<div id="bar">
  <button class="ctl" id="fs">Ceo ekran</button>
  <span class="sep"></span>
  <button class="reg on" data-reg="0">Klarinet</button>
  <button class="reg" data-reg="1">Fagot</button>
  <button class="reg" data-reg="2">Pikolo</button>
  <button class="reg" data-reg="3">Fagot + Klarinet</button>
  <button class="reg" data-reg="4">Klarinet + Pikolo</button>
  <button class="reg" data-reg="5">Master</button>
  <span class="sep"></span>
  <button class="ctl" id="octDown" title="Oktava niže">−</button>
  <span class="oct" id="octLbl">0</span>
  <button class="ctl" id="octUp" title="Oktava više">+</button>
  <span class="sep"></span>
  <button class="ctl" id="names">Note</button>
  <button class="ctl" id="flip">Okreni redove</button>
  <span class="spacer"></span>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" title="Jačina">
</div>
<div id="strip" title="Prevuci da pomeriš klavijaturu"><div id="thumb"></div></div>
<div id="board"><div id="keys"></div></div>

<script>
(() => {
  'use strict';

  // ---------- Layout model (B-griff) ----------
  // Semitone of button (row r, column i) = base + 3*i + r.
  // Row 0 starts on H, row 1 on C, row 2 on Cis; rows 3 and 4 duplicate rows 0 and 1.
  const ROWS = 5;
  const COLS = 18;
  const BASE_MIDI = 47;               // H2
  const NAMES = ['C','Cis','D','Es','E','F','Fis','G','As','A','B','H'];
  const BLACK = new Set([1,3,6,8,10]);

  // Registers: octave offsets of the reeds that sound together, all dry (no detune)
  const REGISTERS = [[0], [-12], [12], [-12,0], [0,12], [-12,0,12]];

  let octaveShift = 0;      // in octaves
  let register = 0;
  let flipped = false;
  let volume = 0.7;

  const board = document.getElementById('board');
  const keysEl = document.getElementById('keys');
  const strip = document.getElementById('strip');
  const thumb = document.getElementById('thumb');
  const keyEls = [];        // index k = r*COLS + i

  // Scrolling along the keyboard: vertical in portrait, horizontal in landscape
  let vertical = false;
  let scroll = 0, maxScroll = 0, alongLen = 0, viewLen = 0;

  function semitoneOf(r, i) { return BASE_MIDI + 3*i + r + 12*octaveShift; }
  function midiToHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function labelFor(m) {
    const n = NAMES[((m % 12) + 12) % 12];
    const oct = Math.floor(m / 12) - 1;
    return `${n}<small>${oct}</small>`;
  }

  function buildKeys() {
    keysEl.innerHTML = '';
    keyEls.length = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let i = 0; i < COLS; i++) {
        const el = document.createElement('div');
        el.className = 'key';
        el.dataset.r = r; el.dataset.i = i;
        el.innerHTML = '<span class="n"></span>';
        keysEl.appendChild(el);
        keyEls.push(el);
      }
    }
    layout();
  }

  function layout() {
    const W = board.clientWidth, H = board.clientHeight;
    const pad = 8;
    // The 5 rows fill the short side; the keyboard runs along the long side and scrolls.
    // pitch p along the keyboard; rows are offset by p/3 and stacked at 0.943p so diagonal neighbours touch
    const DY = 0.943;
    vertical = H > W;
    const across = vertical ? W : H;
    viewLen = vertical ? H : W;
    const p = (across - 2*pad) / ((ROWS - 1) * DY + 1);
    const d = p * 0.92;  // button diameter
    const acrossLen = p * ((ROWS - 1) * DY + 1);
    alongLen = p * (COLS + (ROWS - 1) / 3) + 2*pad;
    const v0 = (across - acrossLen) / 2;
    const u0 = pad + Math.max(0, (viewLen - alongLen) / 2);

    for (const el of keyEls) {
      const r = +el.dataset.r, i = +el.dataset.i;
      const vr = flipped ? (ROWS - 1 - r) : r;         // visual row
      const u = u0 + p * (i + r/3) + p/2;              // along the keyboard (low notes first)
      const v = v0 + p * (vr * DY) + p/2;              // across the rows
      el.cx = vertical ? v : u;
      el.cy = vertical ? u : v;
      el.rad = d / 2;
      el.style.width = el.style.height = d + 'px';
      el.style.left = (el.cx - d/2) + 'px';
      el.style.top = (el.cy - d/2) + 'px';
      el.style.fontSize = Math.max(9, d * 0.3) + 'px';
      refreshKey(el);
    }
    maxScroll = Math.max(0, alongLen - viewLen);
    setScroll(scroll);
  }

  function setScroll(s) {
    scroll = Math.max(0, Math.min(maxScroll, s));
    keysEl.style.transform = vertical
      ? `translate3d(0, ${-scroll}px, 0)` : `translate3d(${-scroll}px, 0, 0)`;
    const frac = alongLen > 0 ? Math.min(1, viewLen / alongLen) : 1;
    const w = Math.max(10, frac * 100);
    thumb.style.width = w + '%';
    thumb.style.left = (maxScroll ? scroll / maxScroll : 0) * (100 - w) + '%';
  }

  function refreshKey(el) {
    const m = semitoneOf(+el.dataset.r, +el.dataset.i);
    const pc = ((m % 12) + 12) % 12;
    el.classList.toggle('b', BLACK.has(pc));
    el.classList.toggle('w', !BLACK.has(pc));
    el.classList.toggle('mark', pc === 0);
    el.querySelector('.n').innerHTML = labelFor(m);
    el.dataset.midi = m;
  }

  // ---------- Audio (Web Audio, dry concert tuning) ----------
  let ctx = null, master = null, comp = null, reedWave = null;

  function ensureAudio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.12;
    master = ctx.createGain();
    master.gain.value = volume;
    comp.connect(master).connect(ctx.destination);

    // Reed-like spectrum: strong fundamental, rich upper partials, slight emphasis around 3rd–5th
    const N = 32, real = new Float32Array(N), imag = new Float32Array(N);
    for (let n = 1; n < N; n++) {
      let a = 1 / n;
      if (n >= 3 && n <= 5) a *= 1.35;
      if (n % 2 === 0) a *= 0.8;
      imag[n] = a;
    }
    reedWave = ctx.createPeriodicWave(real, imag, { disableNormalization: false });
  }

  const voices = new Map();   // midi -> {gain, oscs[]}
  const heldCount = new Map();// midi -> number of pointers holding it

  function startVoice(midi) {
    ensureAudio();
    if (voices.has(midi)) return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    const reeds = REGISTERS[register];
    const level = 0.22 / Math.sqrt(reeds.length);
    g.gain.exponentialRampToValueAtTime(level, t + 0.012);

    const oscs = [];
    for (const off of reeds) {
      const f = midiToHz(midi + off);
      const o = ctx.createOscillator();
      o.setPeriodicWave(reedWave);
      o.frequency.value = f;           // exact pitch – no detune
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = Math.min(9000, 1800 + f * 3);
      lp.Q.value = 0.9;
      o.connect(lp).connect(g);
      o.start(t);
      oscs.push(o);
    }
    g.connect(comp);
    voices.set(midi, { gain: g, oscs });
  }

  function stopVoice(midi) {
    const v = voices.get(midi);
    if (!v) return;
    voices.delete(midi);
    const t = ctx.currentTime;
    v.gain.gain.cancelScheduledValues(t);
    v.gain.gain.setValueAtTime(v.gain.gain.value, t);
    v.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    for (const o of v.oscs) o.stop(t + 0.08);
    setTimeout(() => v.gain.disconnect(), 120);
  }

  function stopAll() {
    for (const m of [...voices.keys()]) stopVoice(m);
    heldCount.clear();
    for (const el of keyEls) el.classList.remove('down');
  }

  // ---------- Multi-touch: pointerId -> key element ----------
  const pointers = new Map();

  function keyAt(x, y) {
    // board coordinates -> keyboard coordinates
    if (vertical) y += scroll; else x += scroll;
    // circles: find nearest key whose centre is within radius
    let best = null, bestD = Infinity;
    for (const el of keyEls) {
      const r = el.rad;
      const dx = x - el.cx, dy = y - el.cy, d2 = dx*dx + dy*dy;
      if (d2 <= r*r*1.15 && d2 < bestD) { bestD = d2; best = el; }
    }
    return best;
  }

  function press(el) {
    const m = +el.dataset.midi;
    heldCount.set(m, (heldCount.get(m) || 0) + 1);
    if (heldCount.get(m) === 1) { startVoice(m); }
    el.classList.add('down');
  }
  function release(el) {
    const m = +el.dataset.midi;
    const c = (heldCount.get(m) || 1) - 1;
    if (c <= 0) { heldCount.delete(m); stopVoice(m); el.classList.remove('down'); }
    else heldCount.set(m, c);
  }

  function boardXY(e) {
    const rect = board.getBoundingClientRect();
    return [e.clientX - rect.left, e.clientY - rect.top];
  }

  board.addEventListener('pointerdown', e => {
    e.preventDefault();
    board.setPointerCapture?.(e.pointerId);
    const [x, y] = boardXY(e);
    const el = keyAt(x, y);
    if (!el) return;
    pointers.set(e.pointerId, el);
    press(el);
  });
  board.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const [x, y] = boardXY(e);
    const el = keyAt(x, y);
    const prev = pointers.get(e.pointerId);
    if (el && el !== prev) { release(prev); pointers.set(e.pointerId, el); press(el); }
  });
  function up(e) {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    pointers.delete(e.pointerId);
    release(prev);
  }
  board.addEventListener('pointerup', up);
  board.addEventListener('pointercancel', up);
  board.addEventListener('lostpointercapture', up);
  board.addEventListener('contextmenu', e => e.preventDefault());
  board.addEventListener('wheel', e => {
    e.preventDefault();
    setScroll(scroll + e.deltaY + e.deltaX);
  }, { passive: false });

  // ---------- Scroll strip: drag to move the keyboard with the finger ----------
  let stripDrag = null;     // {id, x, y}
  strip.addEventListener('pointerdown', e => {
    e.preventDefault();
    strip.setPointerCapture?.(e.pointerId);
    stripDrag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    strip.classList.add('drag');
  });
  strip.addEventListener('pointermove', e => {
    if (!stripDrag || e.pointerId !== stripDrag.id) return;
    const dx = e.clientX - stripDrag.x, dy = e.clientY - stripDrag.y;
    stripDrag.x = e.clientX; stripDrag.y = e.clientY;
    const along = vertical ? dy : dx, perp = vertical ? dx : dy;
    // Moving along the keyboard drags it 1:1. In portrait a sideways swipe along the
    // strip works too: one full swipe across the strip covers the whole keyboard.
    const delta = Math.abs(along) >= Math.abs(perp)
      ? along : perp * Math.max(1, maxScroll / Math.max(1, strip.clientWidth));
    setScroll(scroll - delta);
  });
  function stripUp(e) {
    if (!stripDrag || e.pointerId !== stripDrag.id) return;
    stripDrag = null;
    strip.classList.remove('drag');
  }
  strip.addEventListener('pointerup', stripUp);
  strip.addEventListener('pointercancel', stripUp);
  strip.addEventListener('lostpointercapture', stripUp);
  strip.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Controls ----------
  document.querySelectorAll('.reg').forEach(b => b.addEventListener('click', () => {
    register = +b.dataset.reg;
    document.querySelectorAll('.reg').forEach(x => x.classList.toggle('on', x === b));
    stopAll();
  }));
  const octLbl = document.getElementById('octLbl');
  function setOct(v) {
    octaveShift = Math.max(-1, Math.min(1, v));
    octLbl.textContent = (octaveShift > 0 ? '+' : '') + octaveShift;
    stopAll();
    keyEls.forEach(refreshKey);
  }
  document.getElementById('octDown').addEventListener('click', () => setOct(octaveShift - 1));
  document.getElementById('octUp').addEventListener('click', () => setOct(octaveShift + 1));
  document.getElementById('names').addEventListener('click', e => {
    board.classList.toggle('names'); e.currentTarget.classList.toggle('on');
  });
  document.getElementById('flip').addEventListener('click', e => {
    flipped = !flipped; e.currentTarget.classList.toggle('on', flipped); stopAll(); layout();
  });
  document.getElementById('vol').addEventListener('input', e => {
    volume = +e.target.value; if (master) master.gain.value = volume;
  });
  document.getElementById('fs').addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else await document.exitFullscreen();
    } catch (_) {}
  });

  // Unlock audio as early as possible on first interaction
  ['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
    window.addEventListener(ev, ensureAudio, { once: true, passive: true }));

  window.addEventListener('resize', layout);
  window.addEventListener('blur', stopAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });

  buildKeys();
})();
</script>
</body>
</html>
